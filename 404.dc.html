<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @keyframes float404 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes floatSlow { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  body { margin: 0; background: oklch(0.98 0.006 75); font-family: 'Manrope', sans-serif; }
  a { color: oklch(0.5 0.11 195); text-decoration: none; }
  a:hover { color: oklch(0.4 0.11 195); }
</style>
</helmet>

<div style="min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 40px 24px;">

  <div style="position: absolute; top: 8%; left: 8%; width: 220px; height: 220px; border-radius: 50%; background: oklch(0.94 0.03 195); opacity: 0.6; filter: blur(2px);"></div>
  <div style="position: absolute; bottom: 6%; right: 10%; width: 260px; height: 260px; border-radius: 50%; background: oklch(0.95 0.035 45); opacity: 0.6; filter: blur(2px);"></div>

  <div style="position: absolute; top: 16%; right: 14%; animation: floatSlow 5s ease-in-out infinite;">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.11 195)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
  </div>
  <div style="position: absolute; bottom: 20%; left: 12%; animation: floatSlow 6s ease-in-out infinite 0.5s;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="oklch(0.74 0.13 45)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"></path></svg>
  </div>
  <div style="position: absolute; top: 60%; right: 8%; animation: floatSlow 5.5s ease-in-out infinite 1s;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.11 195)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5L19.5 9.5M14.5 4.5L4 15L2 22L9 20L19.5 9.5M14.5 4.5L19.5 9.5"></path></svg>
  </div>

  <div style="position: relative; z-index: 1; max-width: 640px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px;">

    <div style="position: relative; animation: float404 4s ease-in-out infinite;">
      <h1 style="margin: 0; font-size: 160px; line-height: 1; font-weight: 800; color: oklch(0.22 0.02 260); letter-spacing: -0.03em;">4<span style="color: oklch(0.62 0.11 195);">0</span>4</h1>
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="oklch(0.74 0.13 45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: -6px; right: -10px;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
    </div>

    <span style="background: oklch(0.94 0.03 195); color: oklch(0.3 0.06 195); font-size: 13px; font-weight: 800; padding: 6px 16px; border-radius: 100px; letter-spacing: 0.02em; font-family: 'Nunito', sans-serif;">Страница не найдена</span>

    <h2 style="margin: 0; font-size: 30px; line-height: 1.3; font-weight: 800; color: oklch(0.22 0.02 260); letter-spacing: -0.01em;">Упс, кажется у нас произошла ошибка</h2>
    <p style="margin: 0; font-size: 17px; line-height: 1.55; color: oklch(0.45 0.02 260); font-family: 'Nunito', sans-serif; font-weight: 500; max-width: 460px;">Разработчики уже работают над её решением. А пока предлагаем вернуться на главную страницу.</p>

    <a href="/" style="margin-top: 10px; background: oklch(0.62 0.11 195); color: white; padding: 16px 30px; border-radius: 14px; font-size: 15.5px; font-weight: 700; font-family: 'Manrope', sans-serif; display: inline-flex; align-items: center; gap: 9px; box-shadow: 0 10px 26px oklch(0.62 0.11 195 / 0.3);">
      Перейти на главную
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>

  </div>
</div>

</x-dc>
</body>
</html>
